<script>
// 긴 덩어리(.fold)를 첫 4줄만 보이게 접고 「더 보기」 단추를 단다. 자바스크립트가 없으면 모두 펼쳐진 채로 보인다.
document.addEventListener("DOMContentLoaded", () => {
  const LINES = 4;
  document.querySelectorAll(".fold").forEach(el => {
    const first = el.querySelector("p, li") || el;
    const lh = parseFloat(getComputedStyle(first).lineHeight) || 26;
    // 원고·피고 상자처럼 여백·머리줄이 있는 덩어리는 그만큼 더 보여 실제 글이 4줄 남짓 보이게 한다
    const pad = el.querySelector(".claims") ? 64 : 8;
    const max = Math.round(lh * LINES + pad);
    if (el.scrollHeight <= max + lh * 1.5) return;          // 한두 줄 더 길 뿐이면 접지 않는다
    el.classList.add("folded");
    el.style.maxHeight = max + "px";
    const b = document.createElement("button");
    b.type = "button"; b.className = "fold-btn"; b.textContent = "더 보기 ▾";
    b.setAttribute("aria-expanded", "false");
    b.addEventListener("click", () => {
      const open = el.classList.contains("folded");
      el.classList.toggle("folded", !open);
      el.style.maxHeight = open ? "none" : max + "px";
      b.textContent = open ? "접기 ▴" : "더 보기 ▾";
      b.setAttribute("aria-expanded", String(open));
      if (!open) el.scrollIntoView({ block: "nearest" });
    });
    el.insertAdjacentElement("afterend", b);
  });
});
</script>
