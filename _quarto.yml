project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "cases/*.qmd"
    - "briefings/*.md"
  resources:
    - assets/*.js
    - assets/figures/*.png

website:
  title: "2026 미국 선거 법·제도 분쟁 트래커"
  site-url: "https://woochangkang.github.io/election-law-tracker-2026/"
  navbar:
    left:
      - href: index.qmd
        text: 개요
      - href: cases.qmd
        text: 사건표
      - href: log.qmd
        text: 날짜별 기록
      - href: briefings.qmd
        text: 일일 브리핑
      - href: glossary.qmd
        text: 용어 풀이
      - href: about.qmd
        text: 자료와 방법

format:
  html:
    theme: cosmo
    css: assets/style.css
    lang: ko
    toc: false
    include-after-body: assets/fold.html   # 접기(첫 4줄 + 더 보기) — 파일 내용이 각 페이지에 그대로 들어간다
    include-in-header:
      text: |
        <link rel="preconnect" href="https://cdn.jsdelivr.net">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
